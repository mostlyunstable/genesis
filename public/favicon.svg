<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Orange flame gradient for left facet -->
    <linearGradient id="genysisOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D42" />
      <stop offset="45%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="genysisOrangeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Silver/white metallic gradient for right facet -->
    <linearGradient id="genysisSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="genysisSilverDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Soft dark drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Left Orange Facets (Hex S-hook left wing) -->
    <!-- Top-left orange slant -->
    <path d="M50 14 L24 33 L24 48 L44 33 L50 28 Z" fill="url(#genysisOrange)" />
    <!-- Mid-lower orange chevron -->
    <path d="M24 53 L24 67 L50 86 L50 71 L34 57 Z" fill="url(#genysisOrangeDark)" />
    <path d="M34 57 L50 71 L59 55 L42 42 Z" fill="url(#genysisOrange)" />

    <!-- Right Silver/White Facets (Hex S-hook right wing & bottom barb) -->
    <!-- Top right silver roof -->
    <path d="M50 28 L62 20 L80 34 L80 49 L60 35 Z" fill="url(#genysisSilver)" />
    <!-- Lower silver wing and sharp downward barb -->
    <path d="M80 49 L50 71 L50 86 L70 58 L80 49 Z" fill="url(#genysisSilverDark)" />
    <path d="M60 35 L80 49 L50 71 L50 56 Z" fill="url(#genysisSilver)" />
  </g>
</svg>
