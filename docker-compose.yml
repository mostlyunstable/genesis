version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_db_secret_2026!
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_db_secret_2026!@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=sentinel_prod_secret_key_8fbc23a19e840d2105c317a9
      - FORWARDER_API_KEY=sentinel_fwd_live_9942a8b9e1
      - DEMO_MODE=true
      - DRY_RUN_DEFAULT=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-net

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-worker
    restart: unless-stopped
    command: ["python", "-m", "backend.app.worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinel_db_secret_2026!@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentinel-net

volumes:
  postgres_data:
  redis_data:

networks:
  sentinel-net:
    driver: bridge
